# Copy this site directory to the root of its GitLab project.
# GitLab Pages serves only dist/; there is no server-side runtime.
image: node:22-bookworm

stages:
  - deploy

variables:
  ASTRO_TELEMETRY_DISABLED: "1"

create-pages:
  stage: deploy
  script:
    - npm ci
    - npm run build
  pages:
    publish: dist
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Opt-in check only: no bot token, source writes, commits or deployment.
# No schedule is created by this file. A future schedule requires owner setup.
check-releases:
  stage: deploy
  script:
    - npm run test:releases
    - npm run update-releases
  artifacts:
    when: always
    paths:
      - .release-check/
    expire_in: 14 days
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
